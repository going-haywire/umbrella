# The umbrella environment: every haywire package from every repo in this folder, as
# editable installs, for running the full studio. Each repo keeps its own environment
# for its own tests. Paths are relative, so the same file works wherever the repos are
# cloned side by side.
[project]
name = "haywire-umbrella"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "haywire-core",
    "haywire-studio",
    "haybale-TEST_A",
    "haybale-audio",
    "haybale-core",
    "haybale-example",
    "haybale-graph-editor",
    "haybale-haystack",
    "haybale-image",
    "haybale-marketplace",
    "haybale-models",
    "haybale-share",
    "haybale-studio",
    "haybale-testing",
    "haybale-comfyui",
    "haybale-protokol",
    "haybale-protokol-osc",
    "haybale-spandrel",
    "haybale-stream",
    "haybale-visiongraph",
]

[tool.uv]
package = false

[tool.uv.sources]
haywire-core = { path = "haywire-repo/packages/haywire-core", editable = true }
haywire-studio = { path = "haywire-repo/packages/haywire-studio", editable = true }
haybale-TEST_A = { path = "haywire-repo/barn/haybale-TEST_A", editable = true }
haybale-audio = { path = "haywire-repo/barn/haybale-audio", editable = true }
haybale-core = { path = "haywire-repo/barn/haybale-core", editable = true }
haybale-example = { path = "haywire-repo/barn/haybale-example", editable = true }
haybale-graph-editor = { path = "haywire-repo/barn/haybale-graph-editor", editable = true }
haybale-haystack = { path = "haywire-repo/barn/haybale-haystack", editable = true }
haybale-image = { path = "haywire-repo/barn/haybale-image", editable = true }
haybale-marketplace = { path = "haywire-repo/barn/haybale-marketplace", editable = true }
haybale-models = { path = "haywire-repo/barn/haybale-models", editable = true }
haybale-share = { path = "haywire-repo/barn/haybale-share", editable = true }
haybale-studio = { path = "haywire-repo/barn/haybale-studio", editable = true }
haybale-testing = { path = "haywire-repo/barn/haybale-testing", editable = true }
haybale-comfyui = { path = "haybale-comfyui/barn/haybale-comfyui", editable = true }
haybale-protokol = { path = "haybale-protokol/barn/haybale-protokol", editable = true }
haybale-protokol-osc = { path = "haybale-protokol/barn/haybale-protokol-osc", editable = true }
haybale-spandrel = { path = "haybale-spandrel/barn/haybale-spandrel", editable = true }
haybale-stream = { path = "haybale-stream/barn/haybale-stream", editable = true }
haybale-visiongraph = { path = "haybale-visiongraph/barn/haybale-visiongraph", editable = true }
